<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="07 / Cor com semântica"><title>07 / Cor com semântica</title><desc>Trilha · a paleta comunica função, prioridade e estado</desc><rect width="800" height="500" fill="#F7F8F4"/><g font-family="Arial, Helvetica, sans-serif"><text x="28" y="38" font-size="25" fill="#172B2A" font-weight="700" text-anchor="start">07 / Cor com semântica</text><text x="28" y="65" font-size="16" fill="#536766" font-weight="400" text-anchor="start">Trilha · a paleta comunica função, prioridade e estado</text><rect x="28" y="89" width="352" height="317" rx="18" fill="#FFFFFF" stroke="#CCD8D2" stroke-width="1"/><rect x="44" y="103" width="100" height="30" rx="15" fill="#FAE6DF" stroke="none" stroke-width="1"/><text x="94.0" y="124" font-size="14" fill="#A13936" font-weight="600" text-anchor="middle">ANTES</text><rect x="420" y="89" width="352" height="317" rx="18" fill="#FFFFFF" stroke="#CCD8D2" stroke-width="1"/><rect x="436" y="103" width="100" height="30" rx="15" fill="#E2F2EB" stroke="none" stroke-width="1"/><text x="486.0" y="124" font-size="14" fill="#126B56" font-weight="600" text-anchor="middle">DEPOIS</text><text x="48" y="159" font-size="23" fill="#172B2A" font-weight="700" text-anchor="start">Cor por preferência</text><rect x="48" y="181" width="308" height="55" rx="10" fill="#E77751" stroke="none" stroke-width="1"/><text x="202" y="215" font-size="19" fill="#FFFFFF" font-weight="600" text-anchor="middle">Continuar</text><rect x="48" y="249" width="146" height="47" rx="9" fill="#479881" stroke="none" stroke-width="1"/><text x="121" y="279" font-size="17" fill="#FFFFFF" font-weight="600" text-anchor="middle">Salvar</text><rect x="210" y="249" width="146" height="47" rx="9" fill="#9471BC" stroke="none" stroke-width="1"/><text x="283" y="279" font-size="17" fill="#FFFFFF" font-weight="600" text-anchor="middle">Aula 3</text><circle cx="61" cy="331" r="7" fill="#DC6060" stroke="none" stroke-width="1"/><text x="79" y="337" font-size="17" fill="#172B2A" font-weight="400" text-anchor="start">Download</text><text x="48" y="373" font-size="14" fill="#A13936" font-weight="400" text-anchor="start">O vermelho explica qual estado?</text><text x="440" y="159" font-size="23" fill="#172B2A" font-weight="700" text-anchor="start">Cor por função</text><rect x="440" y="180" width="308" height="42" rx="10" fill="#126B56" stroke="none" stroke-width="1"/><text x="594.0" y="207" font-size="16" fill="#FFFFFF" font-weight="600" text-anchor="middle">Continuar aula 3</text><rect x="440" y="235" width="147" height="42" rx="10" fill="#FFFFFF" stroke="#126B56" stroke-width="1"/><text x="513.5" y="262" font-size="16" fill="#126B56" font-weight="600" text-anchor="middle">Salvar</text><rect x="601" y="241" width="147" height="30" rx="15" fill="#E2F2EB" stroke="none" stroke-width="1"/><text x="674.5" y="262" font-size="14" fill="#126B56" font-weight="600" text-anchor="middle">Em andamento</text><rect x="440" y="294" width="308" height="45" rx="8" fill="#FAE6DF" stroke="none" stroke-width="1"/><text x="455" y="322" font-size="14" fill="#A13936" font-weight="600" text-anchor="start">! Download falhou · Tentar de novo</text><rect x="440" y="354" width="308" height="33" rx="8" fill="#152C27" stroke="none" stroke-width="1"/><text x="594" y="377" font-size="14" fill="#C4EEDB" font-weight="600" text-anchor="middle">Tema escuro: mesmos papéis</text><line x1="28" y1="427" x2="772" y2="427" stroke="#CCD8D2" stroke-width="2"/><text x="28" y="456" font-size="16" fill="#536766" font-weight="400" text-anchor="start">Matiz identifica; saturação regula intensidade; luminosidade ajuda a separar.</text><text x="28" y="479" font-size="16" fill="#536766" font-weight="400" text-anchor="start">Papéis semânticos e contraste precisam ser verificados em cada tema e estado.</text></g></svg>