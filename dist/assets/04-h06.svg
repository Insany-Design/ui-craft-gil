<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-labelledby="h06-title h06-desc" style="max-width:100%;height:auto"><title id="h06-title">Mostre pistas para retomar o aprendizado</title><desc id="h06-desc">Exemplo esquemático original do app fictício Trilha. Antes: O aluno precisa lembrar nome e número da aula. Depois: Curso, aula e posição estão disponíveis no contexto.</desc><g font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="800" height="600" rx="0" fill="#F3F7F8" stroke="#F3F7F8" stroke-width="1.5"/><text x="28" y="31" font-size="21" fill="#162D3B" font-weight="700" text-anchor="start">Mostre pistas para retomar o aprendizado</text><rect x="26" y="49" width="344" height="28" rx="8" fill="#FFF0EC" stroke="#FFF0EC" stroke-width="1.5"/><text x="44" y="69" font-size="16" fill="#9F3A29" font-weight="700" text-anchor="start">ANTES · ponto de atenção</text><rect x="430" y="49" width="344" height="28" rx="8" fill="#E9F5EF" stroke="#E9F5EF" stroke-width="1.5"/><text x="448" y="69" font-size="16" fill="#0F685D" font-weight="700" text-anchor="start">DEPOIS · solução proposta</text><rect x="26" y="88" width="344" height="390" rx="22" fill="white" stroke="#B9CBD2" stroke-width="1.5"/><text x="50" y="120" font-size="23" fill="#0F685D" font-weight="750" text-anchor="start">trilha</text><text x="50" y="150" font-size="20" fill="#162D3B" font-weight="650" text-anchor="start">Continuar aprendendo</text><line x1="50" y1="163" x2="346" y2="163" stroke="#D6E2E7" stroke-width="2"/><text x="50" y="200" font-size="22" fill="#162D3B" font-weight="700" text-anchor="start">Retomar uma aula</text><text x="50" y="241" font-size="19" fill="#162D3B" font-weight="400" text-anchor="start">Digite o nome do curso</text><rect x="50" y="255" width="292" height="48" rx="12" fill="white" stroke="#D6E2E7" stroke-width="1.5"/><text x="66" y="285" font-size="18" fill="#4D6270" font-weight="400" text-anchor="start">Qual era o nome?</text><text x="50" y="338" font-size="19" fill="#162D3B" font-weight="400" text-anchor="start">Número da aula</text><rect x="50" y="352" width="292" height="48" rx="12" fill="white" stroke="#D6E2E7" stroke-width="1.5"/><text x="66" y="382" font-size="20" fill="#4D6270" font-weight="400" text-anchor="start">___</text><line x1="28" y1="435" x2="368" y2="435" stroke="#D6E2E7" stroke-width="2"/><text x="83" y="462" font-size="17" fill="#4D6270" font-weight="400" text-anchor="middle">Explorar</text><text x="197" y="462" font-size="17" fill="#4D6270" font-weight="400" text-anchor="middle">Salvos</text><text x="311" y="462" font-size="17" fill="#0F685D" font-weight="700" text-anchor="middle">Aprender</text><rect x="430" y="88" width="344" height="390" rx="22" fill="white" stroke="#B9CBD2" stroke-width="1.5"/><text x="454" y="120" font-size="23" fill="#0F685D" font-weight="750" text-anchor="start">trilha</text><text x="454" y="150" font-size="20" fill="#162D3B" font-weight="650" text-anchor="start">Continuar aprendendo</text><line x1="454" y1="163" x2="750" y2="163" stroke="#D6E2E7" stroke-width="2"/><rect x="454" y="180" width="292" height="60" rx="10" fill="#DCEBEF" stroke="#DCEBEF" stroke-width="1.5"/><circle cx="706" cy="198" r="30" fill="#9CC6CD" stroke="none" stroke-width="1"/><path d="M466 240 L529 192 L592 240Z" fill="#347A82"/><path d="M550 240 L599 205 L648 240Z" fill="#69A0A7"/><text x="454" y="270" font-size="22" fill="#162D3B" font-weight="700" text-anchor="start">Design visual</text><text x="454" y="302" font-size="19" fill="#162D3B" font-weight="400" text-anchor="start">Aula 3 · Hierarquia visual</text><text x="454" y="332" font-size="18" fill="#4D6270" font-weight="400" text-anchor="start">Você parou em 04:32</text><rect x="454" y="363" width="292" height="46" rx="10" fill="#174C85" stroke="#174C85" stroke-width="1.5"/><text x="600.0" y="393.0" font-size="19" fill="white" font-weight="650" text-anchor="middle">Continuar de onde parei</text><line x1="432" y1="435" x2="772" y2="435" stroke="#D6E2E7" stroke-width="2"/><text x="487" y="462" font-size="17" fill="#4D6270" font-weight="400" text-anchor="middle">Explorar</text><text x="601" y="462" font-size="17" fill="#4D6270" font-weight="400" text-anchor="middle">Salvos</text><text x="715" y="462" font-size="17" fill="#0F685D" font-weight="700" text-anchor="middle">Aprender</text><circle cx="38" cy="510" r="10" fill="#9F3A29" stroke="none" stroke-width="1"/><text x="38" y="517" font-size="18" fill="white" font-weight="700" text-anchor="middle">!</text><text x="58" y="515" font-size="18" fill="#9F3A29" font-weight="550" text-anchor="start">O aluno precisa lembrar nome</text><text x="58" y="539" font-size="18" fill="#9F3A29" font-weight="550" text-anchor="start">e número da aula.</text><circle cx="442" cy="510" r="10" fill="#0F685D" stroke="none" stroke-width="1"/><text x="442" y="517" font-size="18" fill="white" font-weight="700" text-anchor="middle">✓</text><text x="462" y="515" font-size="18" fill="#0F685D" font-weight="550" text-anchor="start">Curso, aula e posição estão</text><text x="462" y="539" font-size="18" fill="#0F685D" font-weight="550" text-anchor="start">disponíveis no contexto.</text><text x="28" y="583" font-size="14" fill="#4D6270" font-weight="400" text-anchor="start">Estudo de interface · exemplo ilustrativo, sem medição de desempenho</text></g></svg>