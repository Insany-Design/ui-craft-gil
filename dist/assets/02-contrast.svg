<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc"><title id="title">3. Meça o contraste no fundo real</title><desc id="desc">Antes: título e descrição em cinza claro sobre branco e botão claro com texto branco. Depois: texto escuro e botão azul escuro. As razões anotadas referem-se ao texto secundário sobre branco.</desc><g font-family="DejaVu Sans, Arial, sans-serif"><rect x="0" y="0" width="800" height="600" rx="18" fill="#F4F7F8" /><text x="30" y="44" font-size="26" fill="#152D3B" font-weight="700">3. Meça o contraste no fundo real</text><text x="30" y="98" font-size="18" fill="#B42318" font-weight="700">ANTES · leitura frágil</text><rect x="30" y="115" width="350" height="390" rx="16" fill="#fff" stroke="#CBD5DC" /><text x="50" y="150" font-size="22" fill="#152D3B" font-weight="700">Trilha</text><circle cx="342" cy="143" r="12" fill="#E1F3EF"/><text x="342" y="149" font-size="14" fill="#0F766E" font-weight="700" text-anchor="middle">T</text><line x1="50" y1="168" x2="360" y2="168" stroke="#E2E8ED" stroke-width="1" /><text x="420" y="98" font-size="18" fill="#0F766E" font-weight="700">DEPOIS · contraste medido</text><rect x="420" y="115" width="350" height="390" rx="16" fill="#fff" stroke="#CBD5DC" /><text x="440" y="150" font-size="22" fill="#152D3B" font-weight="700">Trilha</text><circle cx="732" cy="143" r="12" fill="#E1F3EF"/><text x="732" y="149" font-size="14" fill="#0F766E" font-weight="700" text-anchor="middle">T</text><line x1="440" y1="168" x2="750" y2="168" stroke="#E2E8ED" stroke-width="1" /><rect x="50" y="190" width="310" height="80" rx="10" fill="#D6E9EF" /><circle cx="273.2" cy="216.4" r="14" fill="#9BCBD0"/><path d="M60 260 l86.80000000000001 -36.0 l74.39999999999999 22.400000000000002 l46.5 -11.200000000000001 l49.6 24.8 Z" fill="#418A92"/><rect x="440" y="190" width="310" height="80" rx="10" fill="#D6E9EF" /><circle cx="663.2" cy="216.4" r="14" fill="#9BCBD0"/><path d="M450 260 l86.80000000000001 -36.0 l74.39999999999999 22.400000000000002 l46.5 -11.200000000000001 l49.6 24.8 Z" fill="#418A92"/><text x="50" y="306" font-size="22" fill="#A8B1BC" font-weight="700">Fundamentos de UI</text><text x="50" y="335" font-size="18" fill="#A8B1BC" font-weight="400">6 aulas • 42 minutos</text><rect x="50" y="359" width="310" height="48" rx="10" fill="#A7C9D7" /><text x="205.0" y="389" font-size="18" fill="#fff" font-weight="700" text-anchor="middle">Continuar</text><rect x="50" y="433" width="310" height="43" rx="8" fill="#FFF4EC" /><text x="65" y="461" font-size="16" fill="#B42318" font-weight="700">Texto: 2,2:1 contra branco</text><text x="440" y="306" font-size="22" fill="#152D3B" font-weight="700">Fundamentos de UI</text><text x="440" y="335" font-size="18" fill="#475569" font-weight="400">6 aulas • 42 minutos</text><rect x="440" y="359" width="310" height="48" rx="10" fill="#075985" /><text x="595.0" y="389" font-size="18" fill="#fff" font-weight="700" text-anchor="middle">Continuar</text><rect x="440" y="433" width="310" height="43" rx="8" fill="#E1F3EF" /><text x="455" y="461" font-size="16" fill="#0F766E" font-weight="700">Texto: 7,6:1 contra branco</text><text x="30" y="548" font-size="17" fill="#152D3B" font-weight="700">Texto comum: ≥ 4,5:1. Informação visual essencial de controles: ≥ 3:1.</text><text x="30" y="575" font-size="16" fill="#526675" font-weight="400">Não dependa só da cor para seleção, erro ou progresso. Teste claro e escuro.</text></g></svg>