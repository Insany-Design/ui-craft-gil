<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" role="img"><title>Mapa de jornada: Trilha, da descoberta à retomada</title><rect x="0" y="0" width="800" height="550" rx="16" fill="#f8fafc" stroke="#e2e8f0"/><text x="28" y="40" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#172554">Mapa de jornada: Trilha, da descoberta à retomada</text><rect x="30" y="95" width="230" height="125" rx="12" fill="#eef2ff" stroke="#cbd5e1"/><text x="45" y="135" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#172554">Descobrir</text><text x="45" y="175" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#172554">Home / busca / filtros</text><rect x="285" y="95" width="230" height="125" rx="12" fill="#eef2ff" stroke="#cbd5e1"/><text x="300" y="135" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#172554">Decidir</text><text x="300" y="175" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#172554">Detalhe / prévia</text><rect x="540" y="95" width="230" height="125" rx="12" fill="#eef2ff" stroke="#cbd5e1"/><text x="555" y="135" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#172554">Participar</text><text x="555" y="175" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#172554">Acesso / inscrição</text><rect x="30" y="275" width="230" height="125" rx="12" fill="#eef2ff" stroke="#cbd5e1"/><text x="45" y="315" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#172554">Aprender</text><text x="45" y="355" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#172554">Player / progresso</text><rect x="285" y="275" width="230" height="125" rx="12" fill="#eef2ff" stroke="#cbd5e1"/><text x="300" y="315" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#172554">Retomar</text><text x="300" y="355" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#172554">Salvos / downloads</text><rect x="540" y="275" width="230" height="125" rx="12" fill="#eef2ff" stroke="#cbd5e1"/><text x="555" y="315" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#172554">Resolver</text><text x="555" y="355" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#172554">Ajuda / preferências</text><text x="30" y="475" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#172554">Cada etapa precisa de entrada, ação, saída e estados alternativos.</text><text x="30" y="510" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#172554">Fluxo de referência, não uma lista obrigatória de telas para todo app.</text></svg>