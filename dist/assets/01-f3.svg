<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 730" role="img" aria-label="03 / Gestalt aplicada ao Trilha"><title>03 / Gestalt aplicada ao Trilha</title><desc>Seis formas de tornar agrupamento, sequência e camadas compreensíveis</desc><rect width="800" height="730" fill="#F7F8F4"/><g font-family="Arial, Helvetica, sans-serif"><text x="28" y="38" font-size="25" fill="#172B2A" font-weight="700" text-anchor="start">03 / Gestalt aplicada ao Trilha</text><text x="28" y="65" font-size="16" fill="#536766" font-weight="400" text-anchor="start">Seis formas de tornar agrupamento, sequência e camadas compreensíveis</text><rect x="28" y="94" width="352" height="167" rx="14" fill="#FFFFFF" stroke="#CCD8D2" stroke-width="1"/><text x="44" y="122" font-size="20" fill="#172B2A" font-weight="700" text-anchor="start">Proximidade</text><rect x="420" y="94" width="352" height="167" rx="14" fill="#FFFFFF" stroke="#CCD8D2" stroke-width="1"/><text x="436" y="122" font-size="20" fill="#172B2A" font-weight="700" text-anchor="start">Semelhança</text><rect x="28" y="278" width="352" height="167" rx="14" fill="#FFFFFF" stroke="#CCD8D2" stroke-width="1"/><text x="44" y="306" font-size="20" fill="#172B2A" font-weight="700" text-anchor="start">Região comum</text><rect x="420" y="278" width="352" height="167" rx="14" fill="#FFFFFF" stroke="#CCD8D2" stroke-width="1"/><text x="436" y="306" font-size="20" fill="#172B2A" font-weight="700" text-anchor="start">Continuidade</text><rect x="28" y="462" width="352" height="167" rx="14" fill="#FFFFFF" stroke="#CCD8D2" stroke-width="1"/><text x="44" y="490" font-size="20" fill="#172B2A" font-weight="700" text-anchor="start">Fechamento</text><rect x="420" y="462" width="352" height="167" rx="14" fill="#FFFFFF" stroke="#CCD8D2" stroke-width="1"/><text x="436" y="490" font-size="20" fill="#172B2A" font-weight="700" text-anchor="start">Figura–fundo</text><text x="44" y="153" font-size="12" fill="#A13936" font-weight="700" text-anchor="start">ANTES</text><text x="212" y="153" font-size="12" fill="#126B56" font-weight="700" text-anchor="start">DEPOIS</text><text x="44" y="178" font-size="16" fill="#172B2A" font-weight="400" text-anchor="start">Tipografia</text><text x="44" y="205" font-size="14" fill="#536766" font-weight="400" text-anchor="start">8 aulas</text><text x="44" y="231" font-size="16" fill="#172B2A" font-weight="400" text-anchor="start">Cor para UI</text><text x="212" y="178" font-size="16" fill="#172B2A" font-weight="400" text-anchor="start">Tipografia</text><text x="212" y="197" font-size="14" fill="#536766" font-weight="400" text-anchor="start">8 aulas</text><text x="212" y="234" font-size="16" fill="#172B2A" font-weight="400" text-anchor="start">Cor para UI</text><rect x="436" y="146" width="144" height="30" rx="15" fill="#E2F2EB" stroke="none" stroke-width="1"/><text x="508.0" y="167" font-size="14" fill="#126B56" font-weight="600" text-anchor="middle">Salvar curso A</text><rect x="604" y="146" width="144" height="30" rx="15" fill="#E2F2EB" stroke="none" stroke-width="1"/><text x="676.0" y="167" font-size="14" fill="#126B56" font-weight="600" text-anchor="middle">Salvar curso A</text><rect x="436" y="186" width="144" height="31" rx="5" fill="#FAE6DF" stroke="none" stroke-width="1"/><text x="508" y="207" font-size="14" fill="#A13936" font-weight="600" text-anchor="middle">Salvar curso B</text><rect x="604" y="186" width="144" height="30" rx="15" fill="#E2F2EB" stroke="none" stroke-width="1"/><text x="676.0" y="207" font-size="14" fill="#126B56" font-weight="600" text-anchor="middle">Salvar curso B</text><text x="436" y="243" font-size="12" fill="#536766" font-weight="400" text-anchor="start">Antes: estilos diferentes</text><text x="604" y="243" font-size="12" fill="#536766" font-weight="400" text-anchor="start">Depois: mesma função</text><rect x="44" y="327" width="148" height="64" rx="8" fill="#F7F8F4" stroke="none" stroke-width="1"/><text x="53" y="354" font-size="16" fill="#172B2A" font-weight="400" text-anchor="start">Curso A</text><text x="53" y="377" font-size="14" fill="#536766" font-weight="400" text-anchor="start">8 aulas</text><text x="53" y="411" font-size="14" fill="#126B56" font-weight="400" text-anchor="start">Salvar</text><rect x="212" y="327" width="148" height="87" rx="8" fill="#E2F2EB" stroke="#126B56" stroke-width="1"/><text x="224" y="354" font-size="16" fill="#172B2A" font-weight="400" text-anchor="start">Curso A</text><text x="224" y="383" font-size="14" fill="#126B56" font-weight="400" text-anchor="start">8 aulas + Salvar</text><text x="44" y="432" font-size="12" fill="#536766" font-weight="400" text-anchor="start">Antes: ação solta</text><text x="212" y="432" font-size="12" fill="#536766" font-weight="400" text-anchor="start">Depois: mesmo cartão</text><line x1="456" y1="363" x2="722" y2="363" stroke="#126B56" stroke-width="3"/><circle cx="456" cy="363" r="17" fill="#126B56" stroke="#126B56" stroke-width="2"/><text x="456" y="368" font-size="15" fill="#FFFFFF" font-weight="600" text-anchor="middle">1</text><circle cx="589" cy="363" r="17" fill="#126B56" stroke="#126B56" stroke-width="2"/><text x="589" y="368" font-size="15" fill="#FFFFFF" font-weight="600" text-anchor="middle">2</text><circle cx="722" cy="363" r="17" fill="#FFFFFF" stroke="#126B56" stroke-width="2"/><text x="722" y="368" font-size="15" fill="#126B56" font-weight="600" text-anchor="middle">3</text><text x="436" y="403" font-size="15" fill="#172B2A" font-weight="400" text-anchor="start">Aulas em uma trilha contínua</text><text x="436" y="428" font-size="13" fill="#536766" font-weight="400" text-anchor="start">O eixo sugere sequência e progressão.</text><path d="M 83 521 a 31 31 0 1 0 30 30" fill="none" stroke="#126B56" stroke-width="8" stroke-linecap="round"/><text x="83" y="561" font-size="16" fill="#126B56" font-weight="700" text-anchor="middle"></text><text x="137" y="533" font-size="15" fill="#172B2A" font-weight="400" text-anchor="start">A forma é percebida</text><text x="137" y="558" font-size="15" fill="#172B2A" font-weight="400" text-anchor="start">mesmo com uma abertura.</text><text x="137" y="585" font-size="13" fill="#536766" font-weight="400" text-anchor="start">Não omita partes essenciais</text><text x="137" y="604" font-size="13" fill="#536766" font-weight="400" text-anchor="start">de ícones e rótulos.</text><rect x="436" y="510" width="314" height="96" rx="8" fill="#516361" stroke="none" stroke-width="1"/><rect x="467" y="523" width="251" height="69" rx="9" fill="#FFFFFF" stroke="none" stroke-width="1"/><text x="484" y="550" font-size="17" fill="#172B2A" font-weight="600" text-anchor="start">Salvar este curso?</text><text x="484" y="574" font-size="14" fill="#126B56" font-weight="400" text-anchor="start">Cancelar</text><text x="628" y="574" font-size="14" fill="#126B56" font-weight="600" text-anchor="start">Salvar</text><text x="436" y="621" font-size="13" fill="#536766" font-weight="400" text-anchor="start">Fundo recua; decisão vira a figura.</text><line x1="28" y1="651" x2="772" y2="651" stroke="#CCD8D2" stroke-width="2"/><text x="28" y="680" font-size="16" fill="#536766" font-weight="400" text-anchor="start">Princípios perceptivos ajudam a explicar relações; não substituem testes.</text><text x="28" y="703" font-size="16" fill="#536766" font-weight="400" text-anchor="start">Os seis exemplos são esquemáticos e originais, aplicados ao app Trilha.</text></g></svg>