<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-labelledby="h07-title h07-desc" style="max-width:100%;height:auto"><title id="h07-title">Acelere a tarefa recorrente</title><desc id="h07-desc">Exemplo esquemático original do app fictício Trilha. Antes: A retomada diária repete uma sequência longa. Depois: Um atalho direto convive com o percurso completo.</desc><g font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="800" height="600" rx="0" fill="#F3F7F8" stroke="#F3F7F8" stroke-width="1.5"/><text x="28" y="31" font-size="21" fill="#162D3B" font-weight="700" text-anchor="start">Acelere a tarefa recorrente</text><rect x="26" y="49" width="344" height="28" rx="8" fill="#FFF0EC" stroke="#FFF0EC" stroke-width="1.5"/><text x="44" y="69" font-size="16" fill="#9F3A29" font-weight="700" text-anchor="start">ANTES · ponto de atenção</text><rect x="430" y="49" width="344" height="28" rx="8" fill="#E9F5EF" stroke="#E9F5EF" stroke-width="1.5"/><text x="448" y="69" font-size="16" fill="#0F685D" font-weight="700" text-anchor="start">DEPOIS · solução proposta</text><rect x="26" y="88" width="344" height="390" rx="22" fill="white" stroke="#B9CBD2" stroke-width="1.5"/><text x="50" y="120" font-size="23" fill="#0F685D" font-weight="750" text-anchor="start">trilha</text><text x="50" y="150" font-size="20" fill="#162D3B" font-weight="650" text-anchor="start">Meu aprendizado</text><line x1="50" y1="163" x2="346" y2="163" stroke="#D6E2E7" stroke-width="2"/><rect x="50" y="184" width="292" height="46" rx="10" fill="#E9EFF5" stroke="#E9EFF5" stroke-width="1.5"/><text x="196.0" y="214.0" font-size="19" fill="#162D3B" font-weight="650" text-anchor="middle">1. Abrir meus cursos</text><line x1="196" y1="231" x2="196" y2="251" stroke="#9F3A29" stroke-width="2"/><rect x="50" y="256" width="292" height="46" rx="10" fill="#E9EFF5" stroke="#E9EFF5" stroke-width="1.5"/><text x="196.0" y="286.0" font-size="19" fill="#162D3B" font-weight="650" text-anchor="middle">2. Encontrar a aula</text><line x1="196" y1="303" x2="196" y2="323" stroke="#9F3A29" stroke-width="2"/><rect x="50" y="328" width="292" height="46" rx="10" fill="#174C85" stroke="#174C85" stroke-width="1.5"/><text x="196.0" y="358.0" font-size="19" fill="white" font-weight="650" text-anchor="middle">3. Tocar em continuar</text><text x="50" y="414" font-size="18" fill="#9F3A29" font-weight="400" text-anchor="start">O mesmo percurso todo dia</text><line x1="28" y1="435" x2="368" y2="435" stroke="#D6E2E7" stroke-width="2"/><text x="83" y="462" font-size="17" fill="#4D6270" font-weight="400" text-anchor="middle">Explorar</text><text x="197" y="462" font-size="17" fill="#4D6270" font-weight="400" text-anchor="middle">Salvos</text><text x="311" y="462" font-size="17" fill="#0F685D" font-weight="700" text-anchor="middle">Aprender</text><rect x="430" y="88" width="344" height="390" rx="22" fill="white" stroke="#B9CBD2" stroke-width="1.5"/><text x="454" y="120" font-size="23" fill="#0F685D" font-weight="750" text-anchor="start">trilha</text><text x="454" y="150" font-size="20" fill="#162D3B" font-weight="650" text-anchor="start">Meu aprendizado</text><line x1="454" y1="163" x2="750" y2="163" stroke="#D6E2E7" stroke-width="2"/><rect x="454" y="182" width="292" height="162" rx="12" fill="#E9F5EF" stroke="#A3CFC0" stroke-width="1.5"/><text x="470" y="212" font-size="21" fill="#0F685D" font-weight="650" text-anchor="start">Volte à sua última aula</text><text x="470" y="245" font-size="18" fill="#162D3B" font-weight="400" text-anchor="start">Design visual · aula 3</text><rect x="470" y="272" width="260" height="46" rx="10" fill="#174C85" stroke="#174C85" stroke-width="1.5"/><text x="600.0" y="302.0" font-size="19" fill="white" font-weight="650" text-anchor="middle">Continuar · 04:32</text><text x="454" y="381" font-size="19" fill="#174C85" font-weight="650" text-anchor="start">Ver todos os meus cursos  ›</text><text x="454" y="413" font-size="17" fill="#4D6270" font-weight="400" text-anchor="start">Caminho completo preservado</text><line x1="432" y1="435" x2="772" y2="435" stroke="#D6E2E7" stroke-width="2"/><text x="487" y="462" font-size="17" fill="#4D6270" font-weight="400" text-anchor="middle">Explorar</text><text x="601" y="462" font-size="17" fill="#4D6270" font-weight="400" text-anchor="middle">Salvos</text><text x="715" y="462" font-size="17" fill="#0F685D" font-weight="700" text-anchor="middle">Aprender</text><circle cx="38" cy="510" r="10" fill="#9F3A29" stroke="none" stroke-width="1"/><text x="38" y="517" font-size="18" fill="white" font-weight="700" text-anchor="middle">!</text><text x="58" y="515" font-size="18" fill="#9F3A29" font-weight="550" text-anchor="start">A retomada diária repete uma</text><text x="58" y="539" font-size="18" fill="#9F3A29" font-weight="550" text-anchor="start">sequência longa.</text><circle cx="442" cy="510" r="10" fill="#0F685D" stroke="none" stroke-width="1"/><text x="442" y="517" font-size="18" fill="white" font-weight="700" text-anchor="middle">✓</text><text x="462" y="515" font-size="18" fill="#0F685D" font-weight="550" text-anchor="start">Um atalho direto convive com</text><text x="462" y="539" font-size="18" fill="#0F685D" font-weight="550" text-anchor="start">o percurso completo.</text><text x="28" y="583" font-size="14" fill="#4D6270" font-weight="400" text-anchor="start">Estudo de interface · exemplo ilustrativo, sem medição de desempenho</text></g></svg>