<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-labelledby="l03-title l03-desc" style="max-width:100%;height:auto"><title id="l03-title">Jakob · aproveite padrões reconhecíveis</title><desc id="l03-desc">Exemplo esquemático original do app fictício Trilha. Antes: Símbolos autorais exigem aprender seu significado. Depois: Busca e salvar usam sinais e rótulos familiares.</desc><g font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="800" height="600" rx="0" fill="#F3F7F8" stroke="#F3F7F8" stroke-width="1.5"/><text x="28" y="31" font-size="21" fill="#162D3B" font-weight="700" text-anchor="start">Jakob · aproveite padrões reconhecíveis</text><rect x="26" y="49" width="344" height="28" rx="8" fill="#FFF0EC" stroke="#FFF0EC" stroke-width="1.5"/><text x="44" y="69" font-size="16" fill="#9F3A29" font-weight="700" text-anchor="start">ANTES · ponto de atenção</text><rect x="430" y="49" width="344" height="28" rx="8" fill="#E9F5EF" stroke="#E9F5EF" stroke-width="1.5"/><text x="448" y="69" font-size="16" fill="#0F685D" font-weight="700" text-anchor="start">DEPOIS · solução proposta</text><rect x="26" y="88" width="344" height="390" rx="22" fill="white" stroke="#B9CBD2" stroke-width="1.5"/><text x="50" y="120" font-size="23" fill="#0F685D" font-weight="750" text-anchor="start">trilha</text><text x="50" y="150" font-size="20" fill="#162D3B" font-weight="650" text-anchor="start">Explorar curso</text><line x1="50" y1="163" x2="346" y2="163" stroke="#D6E2E7" stroke-width="2"/><rect x="50" y="183" width="292" height="49" rx="12" fill="#E9EFF5" stroke="#D6E2E7" stroke-width="1.5"/><text x="69" y="216" font-size="23" fill="#162D3B" font-weight="650" text-anchor="start">✦  Portal</text><rect x="50" y="251" width="292" height="115" rx="12" fill="#F3F7F8" stroke="#D6E2E7" stroke-width="1.5"/><text x="66" y="287" font-size="22" fill="#162D3B" font-weight="700" text-anchor="start">Design visual</text><text x="66" y="333" f