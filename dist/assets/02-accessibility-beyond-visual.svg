<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc"><title id="title">5. Acessibilidade continua fora do olhar</title><desc id="desc">Antes: vídeo sem legenda e botão sem nome acessível. Depois: vídeo com legenda, botão Continuar aula com contorno de foco e nome anunciado pelo leitor de tela. Ilustração de metadados e navegação, não prova de implementação.</desc><g font-family="DejaVu Sans, Arial, sans-serif"><rect x="0" y="0" width="800" height="600" rx="18" fill="#F4F7F8" /><text x="30" y="44" font-size="26" fill="#152D3B" font-weight="700">5. Acessibilidade continua fora do olhar</text><text x="30" y="98" font-size="18" fill="#B42318" font-weight="700">ANTES · só aparência</text><rect x="30" y="115" width="350" height="390" rx="16" fill="#fff" stroke="#CBD5DC" /><text x="50" y="150" font-size="22" fill="#152D3B" font-weight="700">Trilha</text><circle cx="342" cy="143" r="12" fill="#E1F3EF"/><text x="342" y="149" font-size="14" fill="#0F766E" font-weight="700" text-anchor="middle">T</text><line x1="50" y1="168" x2="360" y2="168" stroke="#E2E8ED" stroke-width="1" /><text x="420" y="98" font-size="18" fill="#0F766E" font-weight="700">DEPOIS · nome, papel e estado</text><rect x="420" y="115" width="350" height="390" rx="16" fill="#fff" stroke="#CBD5DC" /><text x="440" y="150" font-size="22" fill="#152D3B" font-weight="700">Trilha</text><circle cx="732" cy="143" r="12" fill="#E1F3EF"/><text x="732" y="149" font-size="14" fill="#0F766E" font-weight="700" text-anchor="middle">T</text><line x1="440" y1="168" x2="750" y2="168" stroke="#E2E8ED" stroke-width="1" /><rect x="50" y="190" width="310" height="148" rx="12" fill="#CBE1E8" /><circle cx="205" cy="261" r="29" fill="#6997A5"/><path d="M200 252 l0 18 l15 -9 Z" fill="#fff"/><text x="65" y="320" font-size="18" fill="#152D3B" font-weight="700">Aula: hierarquia visual</text><rect x="50" y="355" width="310" height="50" rx="8" fill="#F2F5F7" stroke="#D2DDE2" /><text x="65" y="387" font-size="19" fill="#152D3B" font-weight="700">Continuar</text><circle cx="330" cy="380" r="7" fill="#ED8F8B"/><rect x="50" y="426" width="310" height="56" rx="8" fill="#FFF4EC" /><text x="64" y="448" font-size="17" fill="#B42318" font-weight="700">Leitor de tela: “botão”</text><text x="64" y="470" font-size="16" fill="#526675" font-weight="400">Nome e estado ausentes</text><rect x="440" y="190" width="310" height="148" rx="12" fill="#CBE1E8" /><circle cx="595" cy="242" r="25" fill="#075985"/><path d="M590 233 l0 18 l15 -9 Z" fill="#fff"/><rect x="454" y="280" width="282" height="42" rx="6" fill="#152D3B" /><text x="595" y="306" font-size="15" fill="#fff" font-weight="400" text-anchor="middle">[Legenda] Observe a hierarquia.</text><rect x="435" y="350" width="320" height="60" rx="12" fill="none" stroke="#075985" stroke-width="3"/><rect x="440" y="356" width="310" height="48" rx="10" fill="#075985" /><text x="595.0" y="386" font-size="18" fill="#fff" font-weight="700" text-anchor="middle">Continuar aula</text><circle cx="445" cy="350" r="12" fill="#075985"/><text x="445" y="355" font-size="14" fill="#fff" font-weight="700" text-anchor="middle">1</text><rect x="440" y="427" width="310" height="56" rx="8" fill="#E1F3EF" /><text x="454" y="450" font-size="17" fill="#0F766E" font-weight="700">“Continuar aula, botão”</text><text x="454" y="472" font-size="15" fill="#526675" font-weight="400">Foco visível e ordem coerente</text><text x="30" y="548" font-size="17" fill="#152D3B" font-weight="700">Uma tela acessível funciona com leitor de tela, teclado e conteúdo alternativo.</text><text x="30" y="575" font-size="16" fill="#526675" font-weight="400">O contorno mostra o foco. A legenda representa o áudio. A semântica está no código.</text></g></svg>