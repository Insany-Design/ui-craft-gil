<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-labelledby="h05-title h05-desc" style="max-width:100%;height:auto"><title id="h05-title">Proteja ações com consequências reais</title><desc id="h05-desc">Exemplo esquemático original do app fictício Trilha. Antes: Um toque acidental pode apagar todo o progresso. Depois: Consequência explícita e saída segura antes da perda.</desc><g font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="800" height="600" rx="0" fill="#F3F7F8" stroke="#F3F7F8" stroke-width="1.5"/><text x="28" y="31" font-size="21" fill="#162D3B" font-weight="700" text-anchor="start">Proteja ações com consequências reais</text><rect x="26" y="49" width="344" height="28" rx="8" fill="#FFF0EC" stroke="#FFF0EC" stroke-width="1.5"/><text x="44" y="69" font-size="16" fill="#9F3A29" font-weight="700" text-anchor="start">ANTES · ponto de atenção</text><rect x="430" y="49" width="344" height="28" rx="8" fill="#E9F5EF" stroke="#E9F5EF" stroke-width="1.5"/><text x="448" y="69" font-size="16" fill="#0F685D" font-weight="700" text-anchor="start">DEPOIS · solução proposta</text><rect x="26" y="88" width="344" height="390" rx="22" fill="white" stroke="#B9CBD2" stroke-width="1.5"/><text x="50" y="120" font-size="23" fill="#0F685D" font-weight="750" text-anchor="start">trilha</text><text x="50" y="150" font-size="20" fill="#162D3B" font-weight="650" text-anchor="start">Meu aprendizado</text><line x1="50" y1="163" x2="346" y2="163" stroke="#D6E2E7" stroke-width="2"/><text x="50" y="198" font-size="21" fill="#162D3B" font-weight="700" text-anchor="start">Curso · Design visual</text><text x="50" y="232" font-size="19" fill="#4D6270" font-weight="400" text-anchor="start">8 de 12 aulas concluídas</text><rect x="50" y="282" width="292" height="46" rx="10" fill="#174C85" stroke="#174C85" stroke-width="1.5"/><text x="196.0" y="312.0" font-size="19" fill="white" font-weight="650" text-anchor="middle">Continuar aula</text><rect x="50" y="336" width="292" height="46" rx="10" fill="#9F3A29" stroke="#9F3A29" stroke-width="1.5"/><text x="196.0" y="366.0" font-size="19" fill="white" font-weight="650" text-anchor="middle">Apagar progresso</text><text x="50" y="414" font-size="18" fill="#9F3A29" font-weight="400" text-anchor="start">Ações próximas e imediatas</text><line x1="28" y1="435" x2="368" y2="435" stroke="#D6E2E7" stroke-width="2"/><text x="83" y="462" font-size="17" fill="#4D6270" font-weight="400" text-anchor="middle">Explorar</text><text x="197" y="462" font-size="17" fill="#4D6270" font-weight="400" text-anchor="middle">Salvos</text><text x="311" y="462" font-size="17" fill="#0F685D" font-weight="700" text-anchor="middle">Aprender</text><rect x="430" y="88" width="344" height="390" rx="22" fill="white" stroke="#B9CBD2" stroke-width="1.5"/><text x="454" y="120" font-size="23" fill="#0F685D" font-weight="750" text-anchor="start">trilha</text><text x="454" y="150" font-size="20" fill="#162D3B" font-weight="650" text-anchor="start">Confirmar exclusão</text><line x1="454" y1="163" x2="750" y2="163" stroke="#D6E2E7" stroke-width="2"/><text x="454" y="198" font-size="22" fill="#162D3B" font-weight="700" text-anchor="start">Apagar progresso?</text><text x="454" y="232" font-size="19" fill="#162D3B" font-weight="400" text-anchor="start">Você perderá o registro</text><text x="454" y="257" font-size="19" fill="#162D3B" font-weight="400" text-anchor="start">das 8 aulas concluídas.</text><rect x="454" y="292" width="292" height="44" rx="12" fill="#FFF0EC" stroke="#FFF0EC" stroke-width="1.5"/><text x="470" y="320" font-size="17" fill="#9F3A29" font-weight="400" text-anchor="start">Esta ação não pode ser desfeita.</text><rect x="454" y="348" width="292" height="36" rx="10" fill="#174C85" stroke="#174C85" stroke-width="1.5"/><text x="600.0" y="373.0" font-size="19" fill="white" font-weight="650" text-anchor="middle">Manter progresso</text><rect x="454" y="390" width="292" height="32" rx="10" fill="white" stroke="#9F3A29" stroke-width="1.5"/><text x="600.0" y="413.0" font-size="19" fill="#9F3A29" font-weight="650" text-anchor="middle">Apagar progresso</text><line x1="432" y1="435" x2="772" y2="435" stroke="#D6E2E7" stroke-width="2"/><text x="487" y="462" font-size="17" fill="#4D6270" font-weight="400" text-anchor="middle">Explorar</text><text x="601" y="462" font-size="17" fill="#4D6270" font-weight="400" text-anchor="middle">Salvos</text><text x="715" y="462" font-size="17" fill="#0F685D" font-weight="700" text-anchor="middle">Aprender</text><circle cx="38" cy="510" r="10" fill="#9F3A29" stroke="none" stroke-width="1"/><text x="38" y="517" font-size="18" fill="white" font-weight="700" text-anchor="middle">!</text><text x="58" y="515" font-size="18" fill="#9F3A29" font-weight="550" text-anchor="start">Um toque acidental pode</text><text x="58" y="539" font-size="18" fill="#9F3A29" font-weight="550" text-anchor="start">apagar todo o progresso.</text><circle cx="442" cy="510" r="10" fill="#0F685D" stroke="none" stroke-width="1"/><text x="442" y="517" font-size="18" fill="white" font-weight="700" text-anchor="middle">✓</text><text x="462" y="515" font-size="18" fill="#0F685D" font-weight="550" text-anchor="start">Consequência explícita e</text><text x="462" y="539" font-size="18" fill="#0F685D" font-weight="550" text-anchor="start">saída segura antes da perda.</text><text x="28" y="583" font-size="14" fill="#4D6270" font-weight="400" text-anchor="start">Estudo de interface · exemplo ilustrativo, sem medição de desempenho</text></g></svg>