<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc"><title id="title">4. Escalar texto também muda o layout</title><desc id="desc">Antes: texto ampliado no Trilha é cortado pela altura fixa e os controles disputam a mesma linha. Depois: o título quebra em duas linhas, a ação ocupa sua própria linha e a tela permite rolagem.</desc><g font-family="DejaVu Sans, Arial, sans-serif"><rect x="0" y="0" width="800" height="600" rx="18" fill="#F4F7F8" /><text x="30" y="44" font-size="26" fill="#152D3B" font-weight="700">4. Escalar texto também muda o layout</text><text x="30" y="98" font-size="18" fill="#B42318" font-weight="700">ANTES · caixa rígida</text><rect x="30" y="115" width="350" height="390" rx="16" fill="#fff" stroke="#CBD5DC" /><text x="50" y="150" font-size="22" fill="#152D3B" font-weight="700">Trilha</text><circle cx="342" cy="143" r="12" fill="#E1F3EF"/><text x="342" y="149" font-size="14" fill="#0F766E" font-weight="700" text-anchor="middle">T</text><line x1="50" y1="168" x2="360" y2="168" stroke="#E2E8ED" stroke-width="1" /><text x="420" y="98" font-size="18" fill="#0F766E" font-weight="700">DEPOIS · conteúdo cresce</text><rect x="420" y="115" width="350" height="390" rx="16" fill="#fff" stroke="#CBD5DC" /><text x="440" y="150" font-size="22" fill="#152D3B" font-weight="700">Trilha</text><circle cx="732" cy="143" r="12" fill="#E1F3EF"/><text x="732" y="149" font-size="14" fill="#0F766E" font-weight="700" text-anchor="middle">T</text><line x1="440" y1="168" x2="750" y2="168" stroke="#E2E8ED" stroke-width="1" /><text x="50" y="198" font-size="16" fill="#526675" font-weight="400">Texto ampliado no sistema</text><text x="440" y="198" font-size="16" fill="#526675" font-weight="400">Texto ampliado no sistema</text><defs><clipPath id="clip-title"><rect x="50" y="218" width="310" height="47"/></clipPath></defs><rect x="50" y="216" width="310" height="49" rx="6" fill="#FFF3EE" stroke="#B42318" /><g clip-path="url(#clip-title)"><text x="57" y="247" font-size="28" fill="#152D3B" font-weight="700">Introdução ao design</text><text x="57" y="282" font-size="28" fill="#152D3B" font-weight="700">de interfaces</text></g><rect x="50" y="290" width="310" height="70" rx="8" fill="#F8FAFC" stroke="#D9E3E8" /><text x="61" y="321" font-size="25" fill="#152D3B" font-weight="700">Aula 1</text><text x="164" y="321" font-size="25" fill="#075985" font-weight="700">Iniciar aula</text><line x1="157" y1="291" x2="157" y2="358" stroke="#B42318" stroke-width="2" /><path d="M311 339 l10 10 M321 339 l-10 10" fill="none" stroke="#B42318" stroke-width="3" stroke-linecap="round"/><text x="50" y="400" font-size="15" fill="#B42318" font-weight="700">O texto corta. Os controles colidem.</text><text x="50" y="445" font-size="16" fill="#526675" font-weight="400">Aumentar a fonte também exige</text><text x="50" y="469" font-size="16" fill="#526675" font-weight="400">reorganizar o espaço disponível.</text><text x="440" y="240" font-size="27" fill="#152D3B" font-weight="700">Introdução ao</text><text x="440" y="274" font-size="27" fill="#152D3B" font-weight="700">design de interfaces</text><text x="440" y="318" font-size="21" fill="#526675" font-weight="400">Aula 1 • 12 minutos</text><rect x="440" y="341" width="310" height="48" rx="10" fill="#075985" /><text x="595.0" y="371" font-size="24" fill="#fff" font-weight="700" text-anchor="middle">Iniciar aula</text><rect x="440" y="408" width="310" height="64" rx="8" fill="#F0F9F7" /><text x="456" y="435" font-size="18" fill="#0F766E" font-weight="700">Sem corte de conteúdo</text><text x="456" y="458" font-size="16" fill="#526675" font-weight="400">Altura flexível + rolagem</text><rect x="758" y="219" width="4" height="240" rx="2" fill="#E2E8ED" /><rect x="758" y="219" width="4" height="110" rx="2" fill="#6B9197" /><text x="30" y="548" font-size="17" fill="#152D3B" font-weight="700">Prefira estilos semânticos e teste os maiores tamanhos oferecidos pelo SO.</text><text x="30" y="575" font-size="16" fill="#526675" font-weight="400">Na web: texto até 200% sem perda de conteúdo ou função, conforme WCAG 1.4.4.</text></g></svg>