<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc"><title id="title">1. Unidades certas preservam a intenção</title><desc id="desc">Antes: conteúdo do app Trilha fica pequeno por ser definido em pixels físicos. Depois: o mesmo curso usa layout lógico e texto que acompanha a escala do sistema.</desc><g font-family="DejaVu Sans, Arial, sans-serif"><rect x="0" y="0" width="800" height="600" rx="18" fill="#F4F7F8" /><text x="30" y="44" font-size="26" fill="#152D3B" font-weight="700">1. Unidades certas preservam a intenção</text><text x="30" y="98" font-size="18" fill="#B42318" font-weight="700">ANTES · pixels físicos</text><rect x="30" y="115" width="350" height="390" rx="16" fill="#fff" stroke="#CBD5DC" /><text x="50" y="150" font-size="22" fill="#152D3B" font-weight="700">Trilha</text><circle cx="342" cy="143" r="12" fill="#E1F3EF"/><text x="342" y="149" font-size="14" fill="#0F766E" font-weight="700" text-anchor="middle">T</text><line x1="50" y1="168" x2="360" y2="168" stroke="#E2E8ED" stroke-width="1" /><text x="420" y="98" font-size="18" fill="#0F766E" font-weight="700">DEPOIS · unidades lógicas</text><rect x="420" y="115" width="350" height="390" rx="16" fill="#fff" stroke="#CBD5DC" /><text x="440" y="150" font-size="22" fill="#152D3B" font-weight="700">Trilha</text><circle cx="732" cy="143" r="12" fill="#E1F3EF"/><text x="732" y="149" font-size="14" fill="#0F766E" font-weight="700" text-anchor="middle">T</text><line x1="440" y1="168" x2="750" y2="168" stroke="#E2E8ED" stroke-width="1" /><text x="50" y="197" font-size="17" fill="#526675" font-weight="400">Tela de alta densidade</text><text x="440" y="197" font-size="17" fill="#526675" font-weight="400">Layout e texto adaptáveis</text><rect x="75" y="219" width="260" height="162" rx="8" fill="#F8FAFC" stroke="#DCE4E8" /><rect x="91" y="235" width="50" height="42" rx="10" fill="#D6E9EF" /><circle cx="127.0" cy="248.86" r="14" fill="#9BCBD0"/><path d="M101 267 l14.000000000000002 -18.900000000000002 l12.0 11.760000000000002 l7.5 -5.880000000000001 l8.0 13.02 Z" fill="#418A92"/><text x="151" y="249" font-size="11" fill="#152D3B" font-weight="700">Design mobile</text><text x="151" y="266" font-size="9" fill="#526675" font-weight="400">6 aulas • 42 minutos</text><rect x="91" y="292" width="120" height="25" rx="5" fill="#075985" /><text x="151" y="308" font-size="10" fill="#fff" font-weight="700" text-anchor="middle">Continuar</text><line x1="75" y1="397" x2="335" y2="397" stroke="#B42318" stroke-width="2" /><line x1="75" y1="391" x2="75" y2="403" stroke="#B42318" stroke-width="2" /><line x1="335" y1="391" x2="335" y2="403" stroke="#B42318" stroke-width="2" /><text x="205" y="425" font-size="16" fill="#B42318" font-weight="700" text-anchor="middle">Medida presa ao bitmap</text><text x="50" y="471" font-size="16" fill="#526675" font-weight="400">A UI encolhe em outra densidade.</text><rect x="440" y="218" width="92" height="80" rx="10" fill="#D6E9EF" /><circle cx="506.24" cy="244.4" r="14" fill="#9BCBD0"/><path d="M450 288 l25.76 -36.0 l22.08 22.400000000000002 l13.799999999999999 -11.200000000000001 l14.72 24.8 Z" fill="#418A92"/><text x="548" y="244" font-size="22" fill="#152D3B" font-weight="700">Design</text><text x="548" y="270" font-size="22" fill="#152D3B" font-weight="700">mobile</text><text x="440" y="329" font-size="18" fill="#526675" font-weight="400">6 aulas • 42 minutos</text><rect x="440" y="354" width="310" height="48" rx="10" fill="#075985" /><text x="595.0" y="384" font-size="18" fill="#fff" font-weight="700" text-anchor="middle">Continuar</text><rect x="440" y="422" width="148" height="44" rx="8" fill="#E1F3EF" /><text x="514" y="449" font-size="16" fill="#0F766E" font-weight="700" text-anchor="middle">Layout: pt / dp</text><rect x="598" y="422" width="152" height="44" rx="8" fill="#E5EDF6" /><text x="674" y="449" font-size="15" fill="#075985" font-weight="700" text-anchor="middle">Texto escalável</text><text x="30" y="548" font-size="17" fill="#152D3B" font-weight="700">Especifique plataforma e unidade. Pixels físicos servem à renderização.</text><text x="30" y="575" font-size="16" fill="#526675" font-weight="400">Web: CSS px  •  iOS: pt + Dynamic Type  •  Android: dp no layout, sp no texto</text></g></svg>