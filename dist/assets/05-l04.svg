<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-labelledby="l04-title l04-desc" style="max-width:100%;height:auto"><title id="l04-title">Memória · transforme uma massa em grupos úteis</title><desc id="l04-desc">Exemplo esquemático original do app fictício Trilha. Antes: A informação está em um bloco sem estrutura. Depois: Os mesmos dados ganham grupos com significado.</desc><g font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="800" height="600" rx="0" fill="#F3F7F8" stroke="#F3F7F8" stroke-width="1.5"/><text x="28" y="31" font-size="21" fill="#162D3B" font-weight="700" text-anchor="start">Memória · transforme uma massa em grupos úteis</text><rect x="26" y="49" width="344" height="28" rx="8" fill="#FFF0EC" stroke="#FFF0EC" stroke-width="1.5"/><text x="44" y="69" font-size="16" fill="#9F3A29" font-weight="700" text-anchor="start">ANTES · ponto de atenção</text><rect x="430" y="49" width="344" height="28" rx="8" fill="#E9F5EF" stroke="#E9F5EF" stroke-width="1.5"/><text x="448" y="69" font-size="16" fill="#0F685D" font-weight="700" text-anchor="start">DEPOIS · solução proposta</text><rect x="26" y="88" width="344" height="390" rx="22" fill="white" stroke="#B9CBD2" stroke-width="1.5"/><text x="50" y="120" font-size="23" fill="#0F685D" font-weight="750" text-anchor="start">trilha</text><text x="50" y="150" font-size="20" fill="#162D3B" font-weight="650" text-anchor="start">Explorar curso</text><line x1="50" y1="163" x2="346" y2="163" stroke="#D6E2E7" stroke-width="2"/><rect x="50" y="181" width="292" height="232" rx="12" fill="#F3F7F8" stroke="#D6E2E7" stroke-width="1.5"/><text x="66" y="210" font-size="19" fill="#162D3B" font-weight="400" text-anchor="start">Design visual para</text><text x="66" y="237" font-size="19" fill="#162D3B" font-weight="400" text-anchor="start">iniciantes com 12 aulas e</text><text x="66" y="264" font-size="19" fill="#162D3B" font-weight="400" text-anchor="start">2 horas. Antes de</text><text x="66" y="291" font-size="19" fill="#162D3B" font-weight="400" text-anchor="start">começar, prepare papel e</text><text x="66" y="318" font-size="19" fill="#162D3B" font-weight="400" text-anchor="start">lápis. A primeira etapa</text><text x="66" y="345" font-size="19" fill="#162D3B" font-weight="400" text-anchor="start">apresenta fundamentos,</text><text x="66" y="372" font-size="19" fill="#162D3B" font-weight="400" text-anchor="start">depois composição e por</text><text x="66" y="399" font-size="19" fill="#162D3B" font-weight="400" text-anchor="start">fim um projeto prático.</text><line x1="28" y1="435" x2="368" y2="435" stroke="#D6E2E7" stroke-width="2"/><text x="83" y="462" font-size="17" fill="#0F685D" font-weight="700" text-anchor="middle">Explorar</text><text x="197" y="462" font-size="17" fill="#4D6270" font-weight="400" text-anchor="middle">Salvos</text><text x="311" y="462" font-size="17" fill="#4D6270" font-weight="400" text-anchor="middle">Aprender</text><rect x="430" y="88" width="344" height="390" rx="22" fill="white" stroke="#B9CBD2" stroke-width="1.5"/><text x="454" y="120" font-size="23" fill="#0F685D" font-weight="750" text-anchor="start">trilha</text><text x="454" y="150" font-size="20" fill="#162D3B" font-weight="650" text-anchor="start">Explorar curso</text><line x1="454" y1="163" x2="750" y2="163" stroke="#D6E2E7" stroke-width="2"/><text x="454" y="198" font-size="22" fill="#162D3B" font-weight="700" text-anchor="start">Design visual</text><rect x="454" y="215" width="292" height="47" rx="12" fill="#E9EFF5" stroke="#D6E2E7" stroke-width="1.5"/><text x="470" y="245" font-size="18" fill="#162D3B" font-weight="400" text-anchor="start">Iniciante · 12 aulas · 2 h</text><text x="454" y="296" font-size="20" fill="#0F685D" font-weight="650" text-anchor="start">Prepare-se</text><text x="454" y="323" font-size="19" fill="#162D3B" font-weight="400" text-anchor="start">Papel e lápis</text><text x="454" y="365" font-size="20" fill="#0F685D" font-weight="650" text-anchor="start">Etapas do curso</text><text x="454" y="393" font-size="18" fill="#162D3B" font-weight="400" text-anchor="start">Fundamentos → composição</text><text x="454" y="418" font-size="18" fill="#162D3B" font-weight="400" text-anchor="start">→ projeto prático</text><line x1="432" y1="435" x2="772" y2="435" stroke="#D6E2E7" stroke-width="2"/><text x="487" y="462" font-size="17" fill="#0F685D" font-weight="700" text-anchor="middle">Explorar</text><text x="601" y="462" font-size="17" fill="#4D6270" font-weight="400" text-anchor="middle">Salvos</text><text x="715" y="462" font-size="17" fill="#4D6270" font-weight="400" text-anchor="middle">Aprender</text><circle cx="38" cy="510" r="10" fill="#9F3A29" stroke="none" stroke-width="1"/><text x="38" y="517" font-size="18" fill="white" font-weight="700" text-anchor="middle">!</text><text x="58" y="515" font-size="18" fill="#9F3A29" font-weight="550" text-anchor="start">A informação está em um bloco</text><text x="58" y="539" font-size="18" fill="#9F3A29" font-weight="550" text-anchor="start">sem estrutura.</text><circle cx="442" cy="510" r="10" fill="#0F685D" stroke="none" stroke-width="1"/><text x="442" y="517" font-size="18" fill="white" font-weight="700" text-anchor="middle">✓</text><text x="462" y="515" font-size="18" fill="#0F685D" font-weight="550" text-anchor="start">Os mesmos dados ganham grupos</text><text x="462" y="539" font-size="18" fill="#0F685D" font-weight="550" text-anchor="start">com significado.</text><text x="28" y="583" font-size="14" fill="#4D6270" font-weight="400" text-anchor="start">Estudo de interface · exemplo ilustrativo, sem medição de desempenho</text></g></svg>