<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="01 / Hierarquia visual"><title>01 / Hierarquia visual</title><desc>Trilha · retomar uma aula em andamento</desc><rect width="800" height="500" fill="#F7F8F4"/><g font-family="Arial, Helvetica, sans-serif"><text x="28" y="38" font-size="25" fill="#172B2A" font-weight="700" text-anchor="start">01 / Hierarquia visual</text><text x="28" y="65" font-size="16" fill="#536766" font-weight="400" text-anchor="start">Trilha · retomar uma aula em andamento</text><rect x="28" y="89" width="352" height="317" rx="18" fill="#FFFFFF" stroke="#CCD8D2" stroke-width="1"/><rect x="44" y="103" width="100" height="30" rx="15" fill="#FAE6DF" stroke="none" stroke-width="1"/><text x="94.0" y="124" font-size="14" fill="#A13936" font-weight="600" text-anchor="middle">ANTES</text><rect x="420" y="89" width="352" height="317" rx="18" fill="#FFFFFF" stroke="#CCD8D2" stroke-width="1"/><rect x="436" y="103" width="100" height="30" rx="15" fill="#E2F2EB" stroke="none" stroke-width="1"/><text x="486.0" y="124" font-size="14" fill="#126B56" font-weight="600" text-anchor="middle">DEPOIS</text><text x="48" y="160" font-size="22" fill="#172B2A" font-weight="700" text-anchor="start">Explore seus cursos</text><text x="48" y="198" font-size="22" fill="#172B2A" font-weight="700" text-anchor="start">TIPOGRAFIA</text><text x="48" y="234" font-size="22" fill="#172B2A" font-weight="700" text-anchor="start">AULA 3 · 12 MIN</text><rect x="48" y="260" width="146" height="42" rx="10" fill="#126B56" stroke="none" stroke-width="1"/><text x="121.0" y="287" font-size="16" fill="#FFFFFF" font-weight="600" text-anchor="middle">Continuar</text><rect x="206" y="260" width="150" height="42" rx="10" fill="#126B56" stroke="none" stroke-width="1"/><text x="281.0" y="287" font-size="16" fill="#FFFFFF" font-weight="600" text-anchor="middle">Salvar</text><rect x="48" y="316" width="308" height="42" rx="10" fill="#126B56" stroke="none" stroke-width