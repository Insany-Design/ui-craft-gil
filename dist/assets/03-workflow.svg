<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" role="img"><title>Da hipótese à interface funcionando</title><rect x="0" y="0" width="800" height="550" rx="16" fill="#f8fafc" stroke="#e2e8f0"/><text x="28" y="40" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#172554">Da hipótese à interface funcionando</text><rect x="25" y="90" width="242" height="135" rx="12" fill="#eef2ff" stroke="#cbd5e1"/><text x="40" y="133" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#172554">1 · Definir</text><text x="40" y="175" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#172554">Tarefa e critério</text><rect x="283" y="90" width="242" height="135" rx="12" fill="#eef2ff" stroke="#cbd5e1"/><text x="298" y="133" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#172554">2 · Estruturar</text><text x="298" y="175" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#172554">Fluxo e estados</text><rect x="541" y="90" width="242" height="135" rx="12" fill="#eef2ff" stroke="#cbd5e1"/><text x="556" y="133" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#172554">3 · Prototipar</text><text x="556" y="175" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#172554">Conteúdo real</text><rect x="25" y="270" width="242" height="135" rx="12" fill="#eef2ff" stroke="#cbd5e1"/><text x="40" y="313" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#172554">4 · Testar</text><text x="40" y="355" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#172554">Pessoas e contexto</text><rect x="283" y="270" width="242" height="135" rx="12" fill="#eef2ff" stroke="#cbd5e1"/><text x="298" y="313" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#172554">5 · Entregar</text><text x="298" y="355" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#172554">Regras e componentes</text><rect x="541" y="270" width="242" height="135" rx="12" fill="#eef2ff" stroke="#cbd5e1"/><text x="556" y="313" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#172554">6 · Verificar</text><text x="556" y="355" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#172554">App implementado</text><text x="30" y="480" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#172554">Figma aprovado não equivale a produto validado.</text><text x="30" y="507" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#172554">Registre evidência, prioridade, decisão e resultado de cada ajuste.</text></svg>