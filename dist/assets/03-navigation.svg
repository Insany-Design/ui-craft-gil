<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" role="img"><title>Navegação: destinos, ações e contexto</title><rect x="0" y="0" width="800" height="550" rx="16" fill="#f8fafc" stroke="#e2e8f0"/><text x="28" y="40" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#172554">Navegação: destinos, ações e contexto</text><text x="30" y="82" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#172554">PROBLEMA · destinos e ações</text><rect x="30" y="105" width="350" height="350" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="420" y="82" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#172554">MELHOR · hierarquia estável</text><rect x="420" y="105" width="350" height="350" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="50" y="150" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#172554">Menu</text><text x="50" y="177" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#172554">Iniciar aula</text><text x="50" y="204" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#172554">Baixar</text><text x="50" y="231" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#172554">Cursos</text><text x="50" y="258" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#172554">Sair</text><text x="50" y="285" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#172554">Favoritar</text><rect x="440" y="125" width="310" height="55" rx="12" fill="#eef2ff" stroke="#cbd5e1"/><text x="456" y="160" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#172554">‹ Explorar</text><text x="440" y="220" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#172554">Fundamentos de UI</text><rect x="440" y="260" width="250" height="48" rx="12" fill="#1d4ed8" stroke="#1d4ed8"/><text x="458" y="291" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="white">Começar aula</text><text x="440" y="340" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#172554">Salvar curso</text><rect x="440" y="380" width="310" height="52" rx="12" fill="#eff6ff" stroke="#cbd5e1"/><text x="450" y="412" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#172554">Início</text><text x="30" y="490" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#172554">Destinos respondem “onde estou?”; ações respondem “o que fazer?”.</text><text x="30" y="517" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#172554">Voltar deve restaurar contexto, filtros e posição da lista.</text><rect x="513" y="386" width="106" height="38" rx="10" fill="#1d4ed8"/><text x="524" y="412" font-family="Arial" font-size="19" fill="white" font-weight="700">Explorar</text><text x="650" y="412" font-family="Arial" font-size="19" fill="#172554">Salvos</text></svg>