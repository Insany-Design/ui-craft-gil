roke="#CCD8D2" stroke-width="1"/><text x="53" y="322" font-size="17" fill="#172B2A" font-weight="600" text-anchor="start">Pesquisa UX</text><text x="53" y="344" font-size="14" fill="#536766" font-weight="400" text-anchor="start">9 aulas · Intermediário</text><text x="440" y="157" font-size="24" fill="#172B2A" font-weight="700" text-anchor="start">Explorar cursos</text><text x="440" y="210" font-size="20" fill="#172B2A" font-weight="600" text-anchor="start">Tipografia</text><text x="440" y="237" font-size="16" fill="#536766" font-weight="400" text-anchor="start">8 aulas · Iniciante</text><line x1="440" y1="259" x2="748" y2="259" stroke="#CCD8D2" stroke-width="2"/><text x="440" y="299" font-size="20" fill="#172B2A" font-weight="600" text-anchor="start">Cor para UI</text><text x="440" y="326" font-size="16" fill="#536766" font-weight="400" text-anchor="start">6 aulas · Iniciante</text><line x1="440" y1="348" x2="748" y2="348" stroke="#CCD8D2" stroke-width="2"/><line x1="735" y1="213" x2="735" y2="231" stroke="#126B56" stroke-width="2"/><text x="722" y="228" font-size="12" fill="#126B56" font-weight="600" text-anchor="end">junto</text><line x1="735" y1="260" x2="735" y2="293" stroke="#126B56" stroke-width="2"/><text x="722" y="282" font-size="12" fill="#126B56" font-weight="600" text-anchor="end">separa</text><line x1="28" y1="427" x2="772" y2="427" stroke="#CCD8D2" stroke-width="2"/><text x="28" y="456" font-size="16" fill="#536766" font-weight="400" text-anchor="start">Espaço pequeno conecta; espaço maior separa.</text><text x="28" y="479" font-size="16" fill="#536766" font-weight="400" text-anchor="start">Mais respiro pode exigir rolagem. Avalie a tarefa, não apenas “quantos cabem”.</text></g></svg>