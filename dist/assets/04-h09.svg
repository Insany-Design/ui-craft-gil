<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-labelledby="h09-title h09-desc" style="max-width:100%;height:auto"><title id="h09-title">O erro precisa abrir um caminho de recuperação</title><desc id="h09-desc">Exemplo esquemático original do app fictício Trilha. Antes: O código técnico não orienta uma próxima ação. Depois: Problema, orientação e tentativa estão juntos.</desc><g font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="800" height="600" rx="0" fill="#F3F7F8" stroke="#F3F7F8" stroke-width="1.5"/><text x="28" y="31" font-size="21" fill="#162D3B" font-weight="700" text-anchor="start">O erro precisa abrir um caminho de recuperação</text><rect x="26" y="49" width="344" height="28" rx="8" fill="#FFF0EC" stroke="#FFF0EC" stroke-width="1.5"/><text x="44" y="69" font-size="16" fill="#9F3A29" font-weight="700" text-anchor="start">ANTES · ponto de atenção</text><rect x="430" y="49" width="344" height="28" rx="8" fill="#E9F5EF" stroke="#E9F5EF" stroke-width="1.5"/><text x="448" y="69" font-size="16" fill="#0F685D" font-weight="700" text-anchor="start">DEPOIS · solução proposta</text><rect x="26" y="88" width="344" height="390" rx="22" fill="white" stroke="#B9CBD2" stroke-width="1.5"/><text x="50" y="120" font-size="23" fill="#0F685D" font-weight="750" text-anchor="start">trilha</text><text x="50" y="150" font-size="20" fill="#162D3B" font-weight="650" text-anchor="start">Salvar curso</text><line x1="50" y1="163" x2="346" y2="163" stroke="#D6E2E7" stroke-width="2"/><rect x="50" y="194" width="292" height="125" rx="12" fill="#FFF0EC" stroke="#DCACA1" stroke-width="1.5"/><text x="66" y="233" font-size="23" fill="#9F3A29" font-weight="700" text-anchor="start">ERR_FETCH_503</text><text x="66" y="270" font-size="19" fill="#9F3A29" font-weight="400" text-anchor="start">Falha na requisição.</text><rect x="50" y="352" width="292" height="46" rx="10" fill="#536E81" stroke="#536E81" stroke-width="1.5"/><text x="196.0" y="382.0" font-size="19" fill="white" font-weight="650" text-anchor="middle">OK</text><line x1="28" y1="435" x2="368" y2="435" stroke="#D6E2E7" stroke-width="2"/><text x="83" y="462" font-size="17" fill="#0F685D" font-weight="700" text-anchor="middle">Explorar</text><text x="197" y="462" font-size="17" fill="#4D6270" font-weight="400" text-anchor="middle">Salvos</text><text x="311" y="462" font-size="17" fill="#4D6270" font-weight="400" text-anchor="middle">Aprender</text><rect x="430" y="88" width="344" height="390" rx="22" fill="white" stroke="#B9CBD2" stroke-width="1.5"/><text x="454" y="120" font-size="23" fill="#0F685D" font-weight="750" text-anchor="start">trilha</text><text x="454" y="150" font-size="20" fill="#162D3B" font-weight="650" text-anchor="start">Salvar curso</text><line x1="454" y1="163" x2="750" y2="163" stroke="#D6E2E7" stroke-width="2"/><rect x="454" y="181" width="292" height="164" rx="12" fill="#FFF0EC" stroke="#DCACA1" stroke-width="1.5"/><circle cx="477" cy="207" r="11" fill="#9F3A29" stroke="none" stroke-width="1"/><text x="477" y="214" font-size="18" fill="white" font-weight="700" text-anchor="middle">!</text><text x="496" y="214" font-size="20" fill="#9F3A29" font-weight="650" text-anchor="start">Não foi possível salvar</text><text x="470" y="248" font-size="19" fill="#162D3B" font-weight="400" text-anchor="start">Tente novamente em</text><text x="470" y="273" font-size="19" fill="#162D3B" font-weight="400" text-anchor="start">instantes.</text><text x="470" y="322" font-size="18" fill="#4D6270" font-weight="400" text-anchor="start">Seu curso continua aberto.</text><rect x="454" y="364" width="292" height="46" rx="10" fill="#174C85" stroke="#174C85" stroke-width="1.5"/><text x="600.0" y="394.0" font-size="19" fill="white" font-weight="650" text-anchor="middle">Tentar novamente</text><line x1="432" y1="435" x2="772" y2="435" stroke="#D6E2E7" stroke-width="2"/><text x="487" y="462" font-size="17" fill="#0F685D" font-weight="700" text-anchor="middle">Explorar</text><text x="601" y="462" font-size="17" fill="#4D6270" font-weight="400" text-anchor="middle">Salvos</text><text x="715" y="462" font-size="17" fill="#4D6270" font-weight="400" text-anchor="middle">Aprender</text><circle cx="38" cy="510" r="10" fill="#9F3A29" stroke="none" stroke-width="1"/><text x="38" y="517" font-size="18" fill="white" font-weight="700" text-anchor="middle">!</text><text x="58" y="515" font-size="18" fill="#9F3A29" font-weight="550" text-anchor="start">O código técnico não orienta</text><text x="58" y="539" font-size="18" fill="#9F3A29" font-weight="550" text-anchor="start">uma próxima ação.</text><circle cx="442" cy="510" r="10" fill="#0F685D" stroke="none" stroke-width="1"/><text x="442" y="517" font-size="18" fill="white" font-weight="700" text-anchor="middle">✓</text><text x="462" y="515" font-size="18" fill="#0F685D" font-weight="550" text-anchor="start">Problema, orientação e</text><text x="462" y="539" font-size="18" fill="#0F685D" font-weight="550" text-anchor="start">tentativa estão juntos.</text><text x="28" y="583" font-size="14" fill="#4D6270" font-weight="400" text-anchor="start">Estudo de interface · exemplo ilustrativo, sem medição de desempenho</text></g></svg>