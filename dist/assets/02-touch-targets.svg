<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc"><title id="title">2. O alvo de toque vai além do ícone</title><desc id="desc">Antes: três ícones do Trilha têm regiões interativas pequenas e próximas, sobrepostas pela área aproximada de um dedo. Depois: os mesmos ícones têm áreas de toque ampliadas, delimitadas por tracejado.</desc><g font-family="DejaVu Sans, Arial, sans-serif"><rect x="0" y="0" width="800" height="600" rx="18" fill="#F4F7F8" /><text x="30" y="44" font-size="26" fill="#152D3B" font-weight="700">2. O alvo de toque vai além do ícone</text><text x="30" y="98" font-size="18" fill="#B42318" font-weight="700">ANTES · alvos comprimidos</text><rect x="30" y="115" width="350" height="390" rx="16" fill="#fff" stroke="#CBD5DC" /><text x="50" y="150" font-size="22" fill="#152D3B" font-weight="700">Trilha</text><circle cx="342" cy="143" r="12" fill="#E1F3EF"/><text x="342" y="149" font-size="14" fill="#0F766E" font-weight="700" text-anchor="middle">T</text><line x1="50" y1="168" x2="360" y2="168" stroke="#E2E8ED" stroke-width="1" /><text x="420" y="98" font-size="18" fill="#0F766E" font-weight="700">DEPOIS · toque com margem</text><rect x="420" y="115" width="350" height="390" rx="16" fill="#fff" stroke="#CBD5DC" /><text x="440" y="150" font-size="22" fill="#152D3B" font-weight="700">Trilha</text><circle cx="732" cy="143" r="12" fill="#E1F3EF"/><text x="732" y="149" font-size="14" fill="#0F766E" font-weight="700" text-anchor="middle">T</text><line x1="440" y1="168" x2="750" y2="168" stroke="#E2E8ED" stroke-width="1" /><rect x="50" y="190" width="100" height="78" rx="10" fill="#D6E9EF" /><circle cx="122.0" cy="215.74" r="14" fill="#9BCBD0"/><path d="M60 258 l28.000000000000004 -35.1 l24.0 21.840000000000003 l15.0 -10.920000000000002 l16.0 24.18 Z" fill="#418A92"/><text x="166" y="220" font-size="18" fill="#152D3B" font-weight="700">Design mobile</text><text x="166" y="247" font-size="16" fill="#526675" font-weight="400">Aula 3 de 6</text><text x="50" y="307" font-size="17" fill="#526675" font-weight="400">Salvar  /  baixar  /  mais</text><rect x="107" y="330" width="28" height="28" rx="5" fill="#EEF4F6" stroke="#CBD5DC" /><rect x="143" y="330" width="28" height="28" rx="5" fill="#EEF4F6" stroke="#CBD5DC" /><rect x="179" y="330" width="28" height="28" rx="5" fill="#EEF4F6" stroke="#CBD5DC" /><path d="M115 336 h12 v16 l-6 -4 l-6 4 Z" fill="none" stroke="#075985" stroke-width="2"/><path d="M157 336 v13 m-5 -5 l5 5 l5 -5 M150 353 h14" fill="none" stroke="#075985" stroke-width="2"/><circle cx="193" cy="337" r="1.8" fill="#075985"/><circle cx="193" cy="344" r="1.8" fill="#075985"/><circle cx="193" cy="351" r="1.8" fill="#075985"/><circle cx="154" cy="344" r="33" fill="#FFE7DD"/><circle cx="154" cy="344" r="26" fill="none" stroke="#B42318"/><path d="M148 338 l10 10 M158 338 l-10 10" fill="none" stroke="#B42318" stroke-width="3" stroke-linecap="round"/><line x1="173" y1="373" x2="217" y2="403" stroke="#B42318" stroke-width="2" /><text x="50" y="435" font-size="16" fill="#B42318" font-weight="700">O dedo alcança ações vizinhas.</text><text x="50" y="469" font-size="16" fill="#526675" font-weight="400">Visual menor ≠ toque menor.</text><rect x="440" y="190" width="100" height="78" rx="10" fill="#D6E9EF" /><circle cx="512.0" cy="215.74" r="14" fill="#9BCBD0"/><path d="M450 258 l28.000000000000004 -35.1 l24.0 21.840000000000003 l15.0 -10.920000000000002 l16.0 24.18 Z" fill="#418A92"/><text x="556" y="220" font-size="18" fill="#152D3B" font-weight="700">Design mobile</text><text x="556" y="247" font-size="16" fill="#526675" font-weight="400">Aula 3 de 6</text><rect x="457" y="315" width="70" height="70" rx="14" fill="#F0F9F7" stroke="#0F766E" stroke-width="2" stroke-dasharray="5 4"/><rect x="551" y="315" width="70" height="70" rx="14" fill="#F0F9F7" stroke="#0F766E" stroke-width="2" stroke-dasharray="5 4"/><rect x="645" y="315" width="70" height="70" rx="14" fill="#F0F9F7" stroke="#0