<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-labelledby="h10-title h10-desc" style="max-width:100%;height:auto"><title id="h10-title">Ajuda no momento e no lugar da dúvida</title><desc id="h10-desc">Exemplo esquemático original do app fictício Trilha. Antes: O manual genérico exige procurar e interpretar. Depois: Passos curtos respondem à tarefa em andamento.</desc><g font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="800" height="600" rx="0" fill="#F3F7F8" stroke="#F3F7F8" stroke-width="1.5"/><text x="28" y="31" font-size="21" fill="#162D3B" font-weight="700" text-anchor="start">Ajuda no momento e no lugar da dúvida</text><rect x="26" y="49" width="344" height="28" rx="8" fill="#FFF0EC" stroke="#FFF0EC" stroke-width="1.5"/><text x="44" y="69" font-size="16" fill="#9F3A29" font-weight="700" text-anchor="start">ANTES · ponto de atenção</text><rect x="430" y="49" width="344" height="28" rx="8" fill="#E9F5EF" stroke="#E9F5EF" stroke-width="1.5"/><text x="448" y="69" font-size="16" fill="#0F685D" font-weight="700" text-anchor="start">DEPOIS · solução proposta</text><rect x="26" y="88" width="344" height="390" rx="22" fill="white" stroke="#B9CBD2" stroke-width="1.5"/><text x="50" y="120" font-size="23" fill="#0F685D" font-weight="750" text-anchor="start">trilha</text><text x="50" y="150" font-size="20" fill="#162D3B" font-weight="650" text-anchor="start">Ajuda</text><line x1="50" y1="163" x2="346" y2="163" stroke="#D6E2E7" stroke-width="2"/><text x="50" y="199" font-size="22" fill="#162D3B" font-weight="700" text-anchor="start">Manual do Trilha</text><text x="50" y="235" font-size="19" fill="#162D3B" font-weight="400" text-anchor="start">1. Introdução</text><text x="50" y="267" font-size="19" fill="#162D3B" font-weight="400" text-anchor="start">2. Conta e preferências</text><text x="50" y="299" font-size="19" fill="#162D3B" font-weight="400" text-anchor="start">3. Termos e conceitos</text><text x="50" y="331" font-size="19" fill="#162D3B" font-weight="400" text-anchor="start">4. Todos os recursos</text><rect x="50" y="365" width="292" height="46" rx="12" fill="#FFF0EC" stroke="#FFF0EC" stroke-width="1.5"/><text x="65" y="395" font-size="17" fill="#9F3A29" font-weight="400" text-anchor="start">Onde estão as aulas offline?</text><line x1="28" y1="435" x2="368" y2="435" stroke="#D6E2E7" stroke-width="2"/><text x="83" y="462" font-size="17" fill="#4D6270" font-weight="400" text-anchor="middle">Explorar</text><text x="197" y="462" font-size="17" fill="#4D6270" font-weight="400" text-anchor="middle">Salvos</text><text x="311" y="462" font-size="17" fill="#0F685D" font-weight="700" text-anchor="middle">Aprender</text><rect x="430" y="88" width="344" height="390" rx="22" fill="white" stroke="#B9CBD2" stroke-width="1.5"/><text x="454" y="120" font-size="23" fill="#0F685D" font-weight="750" text-anchor="start">trilha</text><text x="454" y="150" font-size="20" fill="#162D3B" font-weight="650" text-anchor="start">Ajuda da aula</text><line x1="454" y1="163" x2="750" y2="163" stroke="#D6E2E7" stroke-width="2"/><text x="454" y="199" font-size="21" fill="#162D3B" font-weight="700" text-anchor="start">Como assistir sem internet?</text><rect x="454" y="220" width="292" height="133" rx="12" fill="#E9F5EF" stroke="#A3CFC0" stroke-width="1.5"/><text x="470" y="250" font-size="18" fill="#162D3B" font-weight="400" text-anchor="start">1. Abra uma aula no Wi-Fi.</text><text x="470" y="282" font-size="18" fill="#162D3B" font-weight="400" text-anchor="start">2. Toque em Baixar aula.</text><text x="470" y="314" font-size="18" fill="#162D3B" font-weight="400" text-anchor="start">3. Acesse seus Downloads.</text><rect x="454" y="371" width="292" height="46" rx="10" fill="#174C85" stroke="#174C85" stroke-width="1.5"/><text x="600.0" y="401.0" font-size="19" fill="white" font-weight="650" text-anchor="middle">Ir para Downloads</text><line x1="432" y1="435" x2="772" y2="435" stroke="#D6E2E7" stroke-width="2"/><text x="487" y="462" font-size="17" fill="#4D6270" font-weight="400" text-anchor="middle">Explorar</text><text x="601" y="462" font-size="17" fill="#4D6270" font-weight="400" text-anchor="middle">Salvos</text><text x="715" y="462" font-size="17" fill="#0F685D" font-weight="700" text-anchor="middle">Aprender</text><circle cx="38" cy="510" r="10" fill="#9F3A29" stroke="none" stroke-width="1"/><text x="38" y="517" font-size="18" fill="white" font-weight="700" text-anchor="middle">!</text><text x="58" y="515" font-size="18" fill="#9F3A29" font-weight="550" text-anchor="start">O manual genérico exige</text><text x="58" y="539" font-size="18" fill="#9F3A29" font-weight="550" text-anchor="start">procurar e interpretar.</text><circle cx="442" cy="510" r="10" fill="#0F685D" stroke="none" stroke-width="1"/><text x="442" y="517" font-size="18" fill="white" font-weight="700" text-anchor="middle">✓</text><text x="462" y="515" font-size="18" fill="#0F685D" font-weight="550" text-anchor="start">Passos curtos respondem à</text><text x="462" y="539" font-size="18" fill="#0F685D" font-weight="550" text-anchor="start">tarefa em andamento.</text><text x="28" y="583" font-size="14" fill="#4D6270" font-weight="400" text-anchor="start">Estudo de interface · exemplo ilustrativo, sem medição de desempenho</text></g></svg>